[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "event-command-centre"
version = "0.1.0"
description = "Intelligent Event Command Centre API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "psycopg[binary]==3.1.19",
    "apscheduler==3.10.4",
    "python-multipart==0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "anyio==4.3.0",
    "ruff==0.4.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP", "B"]
ignore = ["S101"]  # allow assert in tests
